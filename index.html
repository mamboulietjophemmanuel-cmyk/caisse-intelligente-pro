<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Caisse Intelligente Pro — Point de Vente Tactile & Hors-Ligne</title>
    <meta name="description" content="Système de caisse enregistreuse tactile mobile-first pour bar, restaurant et commerce. Mode sombre automatique, support hors-ligne avec synchronisation et encaissement rapide en FCFA." />
    
    <!-- OpenGraph & Social -->
    <meta property="og:title" content="Caisse Intelligente Pro — Point de Vente Tactile & Hors-Ligne" />
    <meta property="og:description" content="Système de caisse enregistreuse tactile mobile-first pour bar, restaurant et commerce. Mode sombre automatique, support hors-ligne avec synchronisation et encaissement rapide en FCFA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#09090b" id="theme-color-meta" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CaissePro" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Typography: Plus Jakarta Sans (UI) + Cinzel (Luxury Brand) + JetBrains Mono (Figures) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen antialiased bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 transition-colors">
    <div id="root"></div>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('caisse_pro_settings_v2');
          var themeMode = 'system';
          if (stored) {
            var settings = JSON.parse(stored);
            if (settings && settings.themeMode) themeMode = settings.themeMode;
          }
          var isDark = false;
          if (themeMode === 'dark') {
            isDark = true;
          } else if (themeMode === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
          }
        } catch (e) {
          // Ignore les erreurs de lecture du stockage
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
